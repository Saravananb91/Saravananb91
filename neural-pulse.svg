<svg width="100%" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>

  <!-- layer x-positions: input 120, hidden1 380, hidden2 620, output 880 -->
  <!-- connecting wires -->
  <g stroke="url(#wire)" stroke-width="1.4" opacity="0.35" fill="none">
    <path id="p1" d="M120,50 L380,40"/>
    <path id="p2" d="M120,50 L380,110"/>
    <path id="p3" d="M120,50 L380,180"/>
    <path id="p4" d="M120,110 L380,40"/>
    <path id="p5" d="M120,110 L380,110"/>
    <path id="p6" d="M120,110 L380,180"/>
    <path id="p7" d="M120,170 L380,40"/>
    <path id="p8" d="M120,170 L380,110"/>
    <path id="p9" d="M120,170 L380,180"/>

    <path id="p10" d="M380,40 L620,70"/>
    <path id="p11" d="M380,110 L620,70"/>
    <path id="p12" d="M380,180 L620,70"/>
    <path id="p13" d="M380,40 L620,150"/>
    <path id="p14" d="M380,110 L620,150"/>
    <path id="p15" d="M380,180 L620,150"/>

    <path id="p16" d="M620,70 L880,110"/>
    <path id="p17" d="M620,150 L880,110"/>
  </g>

  <!-- traveling data pulses -->
  <g fill="#e0e7ff">
    <circle r="3.2"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0s"    keyPoints="0;1" keyTimes="0;1" path="M120,50 L380,110"/></circle>
    <circle r="3.2"><animateMotion dur="2.9s" repeatCount="indefinite" begin="0.4s"  path="M120,110 L380,40"/></circle>
    <circle r="3.2"><animateMotion dur="2.3s" repeatCount="indefinite" begin="0.9s"  path="M120,170 L380,180"/></circle>
    <circle r="3.2"><animateMotion dur="2.7s" repeatCount="indefinite" begin="1.3s"  path="M120,50 L380,180"/></circle>
    <circle r="3.2"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.1s"  path="M380,40 L620,70"/></circle>
    <circle r="3.2"><animateMotion dur="2.8s" repeatCount="indefinite" begin="0.6s"  path="M380,110 L620,150"/></circle>
    <circle r="3.2"><animateMotion dur="2.5s" repeatCount="indefinite" begin="1.6s"  path="M380,180 L620,70"/></circle>
    <circle r="3.2"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0.2s"  path="M620,70 L880,110"/></circle>
    <circle r="3.2"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.8s"  path="M620,150 L880,110"/></circle>
  </g>

  <!-- input layer nodes -->
  <g>
    <circle cx="120" cy="50"  r="10" fill="url(#node)"><animate attributeName="r" values="9;12;9" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="110" r="10" fill="url(#node)"><animate attributeName="r" values="9;12;9" dur="2.1s" repeatCount="indefinite" begin="0.3s"/></circle>
    <circle cx="120" cy="170" r="10" fill="url(#node)"><animate attributeName="r" values="9;12;9" dur="1.9s" repeatCount="indefinite" begin="0.6s"/></circle>
  </g>

  <!-- hidden layer 1 -->
  <g>
    <circle cx="380" cy="40"  r="9" fill="url(#node)"><animate attributeName="r" values="8;11;8" dur="2.0s" repeatCount="indefinite" begin="0.2s"/></circle>
    <circle cx="380" cy="110" r="9" fill="url(#node)"><animate attributeName="r" values="8;11;8" dur="1.7s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="380" cy="180" r="9" fill="url(#node)"><animate attributeName="r" values="8;11;8" dur="2.2s" repeatCount="indefinite" begin="0.8s"/></circle>
  </g>

  <!-- hidden layer 2 -->
  <g>
    <circle cx="620" cy="70"  r="9" fill="url(#node)"><animate attributeName="r" values="8;11;8" dur="1.9s" repeatCount="indefinite" begin="0.1s"/></circle>
    <circle cx="620" cy="150" r="9" fill="url(#node)"><animate attributeName="r" values="8;11;8" dur="2.3s" repeatCount="indefinite" begin="0.7s"/></circle>
  </g>

  <!-- output node -->
  <circle cx="880" cy="110" r="13" fill="url(#node)">
    <animate attributeName="r" values="11;16;11" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- labels -->
  <text x="500" y="205" text-anchor="middle" font-family="Fira Code, monospace" font-size="15" fill="#c9d1d9">
    Turning ideas into intelligent systems, one model at a time
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
